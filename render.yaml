services:
  - type: web
    name: vungang-jobs-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: |
      npm install -g pnpm
      pnpm install
      pnpm exec prisma generate
      pnpm exec prisma migrate deploy
      pnpm run build
    startCommand: |
      pnpm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: FRONTEND_URL
        value: https://vungang-jobs-client.onrender.com
      - key: ADMIN_URL
        value: https://vungang-jobs-admin.onrender.com
      - key: APP_NAME
        value: Vũng Áng Jobs
      - key: SUPPORT_EMAIL
        value: support@vungangjobs.vn
      - key: MAIL_FROM
        value: noreply@vungangjobs.vn
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: vungang-jobs-client
    buildCommand: |
      cd frontend-client
      npm install -g pnpm
      HUSKY=0 pnpm install
      pnpm run build
    staticPublishPath: ./frontend-client/dist
    envVars:
      - key: VITE_API_URL
        value: https://vungang-jobs-backend.onrender.com/api
      - key: NODE_ENV
        value: production
      - key: HUSKY
        value: '0'
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: vungang-jobs-admin
    runtime: node
    rootDir: frontend-admin
    plan: free
    buildCommand: |
      npm install -g pnpm
      pnpm install
      pnpm run build
    startCommand: |
      pnpm start -- -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://vungang-jobs-backend.onrender.com/api
      - key: NODE_ENV
        value: production
